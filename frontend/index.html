<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cloud Project Manager</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <div class="header-content">
            <h1>Cloud Project Manager</h1>
            <p>Azure-Based Student Project Management System</p>
        </div>
    </header>

    <main>
        <section class="dashboard-header">
            <div>
                <h2>Your Projects</h2>
                <p>Manage your university projects and tasks.</p>
            </div>

            <button id="addProjectButton">
                + New Project
            </button>
        </section>

        <section id="projectsContainer" class="projects-container">
            <p id="loadingMessage">Loading projects...</p>
        </section>

        <p id="errorMessage" class="error-message"></p>
    </main>

    <script src="app.js"></script>
</body>
</html>
